[project]
name = "verisight"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "python-multipart==0.0.20",
  "pydantic==2.10.6",
  "opencv-python-headless==4.10.0.84",
  "numpy==1.26.4",
  "Pillow==13.0.0",
  "rapidocr-onnxruntime==1.4.4"
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.fastapi.static]
# CORS middleware otherwise keeps StaticFiles requests on the Python function.
cdn = true

[tool.vercel.scripts]
build = "npm run build --prefix frontend"



